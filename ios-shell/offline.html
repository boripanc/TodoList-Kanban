<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Workstream</title>
    <style>
      :root {
        --bg: #f4f5f7;
        --surface: #ffffff;
        --text: #1c2024;
        --muted: #60646c;
        --accent: #0d74ce;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111113;
          --surface: #212225;
          --text: #edeef0;
          --muted: #a0a2a9;
          --accent: #3b9eff;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
        box-sizing: border-box;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.4 -apple-system, system-ui, sans-serif;
        text-align: center;
      }
      main {
        background: var(--surface);
        border-radius: 12px;
        padding: 28px 24px;
        max-width: 320px;
      }
      h1 {
        font-size: 1.2rem;
        margin: 0 0 8px;
      }
      p {
        color: var(--muted);
        margin: 0 0 20px;
      }
      a {
        display: inline-block;
        background: var(--accent);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        padding: 10px 20px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Can't reach your boards</h1>
      <p>Check that you're online, then try again.</p>
      <!-- Keep in step with server.url in capacitor.config.ts. -->
      <a href="https://workstream.teddybiere.info/">Try again</a>
    </main>
  </body>
</html>
